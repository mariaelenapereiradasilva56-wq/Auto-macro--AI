name: Build GD AI MOD for Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode Android64 package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
      - name: Upload installable Geode package
        uses: actions/upload-artifact@v4
        with:
          name: GD-AI-MOD-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
